<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#0B5D3A"/>
  <!-- Outer circle -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Horizontal equator line -->
  <line x1="80" y1="250" x2="420" y2="250" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
  <!-- Left meridian arc -->
  <path d="M 250 80 A 236.69444444444446 236.69444444444446 0 0 0 250 420" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right meridian arc -->
  <path d="M 250 80 A 236.69444444444446 236.69444444444446 0 0 1 250 420" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>